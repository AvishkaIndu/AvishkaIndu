<svg width="950" height="420" viewBox="0 0 950 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    
    .ascii {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
    }

    /* Cyberpunk ID Card Typography */
    .brand { 
      font-size: 38px; 
      font-weight: 800; 
      fill: #58a6ff; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: 3px;
    }
    .name { 
      font-size: 14px; 
      fill: #8b949e; 
      font-family: 'Courier New', Courier, monospace; 
      letter-spacing: 1px;
    }
    .label { 
      fill: #79c0ff; 
      font-weight: 600; 
      font-family: 'Courier New', Courier, monospace; 
      font-size: 15px; 
    }
    .value { 
      fill: #c9d1d9; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
    }
    .icon { fill: #388bfd; font-weight: bold; font-family: 'Courier New', Courier, monospace; }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="10" />
  
  <!-- Glowing ASCII Art Face -->
  <text x="20" y="30" class="ascii" xml:space="preserve">
    <!-- SVG Native Glowing Animation -->
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="3s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#388bfd; #79c0ff; #388bfd" dur="3s" repeatCount="indefinite" />
    
    <tspan x="20" dy="1.2em">                                                      -:.  .:::. </tspan>
    <tspan x="20" dy="1.2em">                                               .::::..::....  :. . .</tspan>
    <tspan x="20" dy="1.2em">                                              . ..:... . .   . ..    .</tspan>
    <tspan x="20" dy="1.2em">                                          :.:..-.</tspan>
    <tspan x="20" dy="1.2em">                                        :-:...                         .</tspan>
    <tspan x="20" dy="1.2em">                                      ..::         :*%%%*=:           :.</tspan>
    <tspan x="20" dy="1.2em">                                     :..        #@@@@@@@@@@@@#.</tspan>
    <tspan x="20" dy="1.2em">                                    --:      .%@@%#+: .-+@@@@@@@.</tspan>
    <tspan x="20" dy="1.2em">                                   ::       +@@@*@@%*==+++%%@##@@</tspan>
    <tspan x="20" dy="1.2em">                                    :     .%@@@@%*- ..=+%@*==:  .*    :</tspan>
    <tspan x="20" dy="1.2em">                                  .:.    .@@@@@@@@@@@@@@@@@*:-===-.</tspan>
    <tspan x="20" dy="1.2em">                                   ::*%%=%@@@@@@@@@@@%+ .*=-%: :=+.</tspan>
    <tspan x="20" dy="1.2em">                                   :#@@@@@@@@@@@@%#**#%%+---*@@+-*</tspan>
    <tspan x="20" dy="1.2em">                                   +@@+#@@@@@@@@%-::@@@+=+*+@@@@@=</tspan>
    <tspan x="20" dy="1.2em">                                    @%++@@@@#%#**@@@@#+=*%*:-#@@@</tspan>
    <tspan x="20" dy="1.2em">                                     ..@@##*===--*%@@@@#*+##:+%#%</tspan>
    <tspan x="20" dy="1.2em">                                     .+@@+=-:... :.:.:=+*#%%+**#+</tspan>
    <tspan x="20" dy="1.2em">                                      *@@@%=.             :-.:-+</tspan>
    <tspan x="20" dy="1.2em">                                      @@@@@%#*=               :</tspan>
    <tspan x="20" dy="1.2em">                                      @@@@@%#*+=--:           :</tspan>
    <tspan x="20" dy="1.2em">                                     @@@@@@@@@%#*-:.....   .</tspan>
    <tspan x="20" dy="1.2em">                                    .@@@@@@@@@%#*=------=+*</tspan>
    <tspan x="20" dy="1.2em">                            -==-:..   *%@@@@@%#*+=====++*#.</tspan>
    <tspan x="20" dy="1.2em">                             :.      .:-:=*%%%##*********#:</tspan>
    <tspan x="20" dy="1.2em">                             :-=.    .:==+==*%%%%%##*=::  -#+</tspan>
    <tspan x="20" dy="1.2em">                     .-+*%%*+**+*+=+++--:=+++*%@@@*:.        =</tspan>
    <tspan x="20" dy="1.2em">             .+%%*#@%**%%%#+****#******+===++**%*::::----      =.</tspan>
    <tspan x="20" dy="1.2em">        =@#%#*#%=*#%**##%*****###***#*#**++**+*#+=+********++*--##*=*=</tspan>
    <tspan x="20" dy="1.2em">      %@%%**#******+*#**#++**#*###***####*++*++#**=*#****#**##**##%#*++#*#*:</tspan>
    <tspan x="20" dy="1.2em">    *@##*##+++%++#++#+*#**#######*++*####+*****##++***##*######**##%****###*+#@%#+</tspan>
  </text>

  <!-- Center-Aligned Creative ID Card Layout - Y position moved down to 145 -->
  <g transform="translate(560, 145)">
    
    <!-- Futuristic UI Accents -->
    <path d="M -25 10 L -25 -15 L 0 -15" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.8" />
    <!-- Bottom bracket -->
    <path d="M 390 200 L 390 225 L 365 225" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.8" />
    <line x1="-25" y1="15" x2="-25" y2="195" stroke="#388bfd" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4" />

    <!-- Text Details -->
    <text y="20">
      <tspan x="0" dy="0" class="brand">AVZORA</tspan>
      <tspan x="0" dy="25" class="name">AVISHKA INDUWARA KUMARASINGHE</tspan>

      <tspan x="0" dy="50" class="icon">>_</tspan>
      <tspan dx="10" class="label">ROLE      :</tspan>
      <tspan dx="15" class="value">Full-Stack Developer</tspan>

      <tspan x="0" dy="35" class="icon">>_</tspan>
      <tspan dx="10" class="label">DEGREE    :</tspan>
      <tspan dx="15" class="value">BICT (HONS)</tspan>

      <tspan x="0" dy="35" class="icon">>_</tspan>
      <tspan dx="10" class="label">UNIVERSITY:</tspan>
      <tspan dx="15" class="value">University of Sri Jayewardenepura</tspan>

      <tspan x="0" dy="35" class="icon">>_</tspan>
      <tspan dx="10" class="label">LOCATION  :</tspan>
      <tspan dx="15" class="value">Sri Lanka</tspan>
    </text>
  </g>

  <!-- Animated Scanner Line -->
  <rect x="0" y="0" width="100%" height="3" fill="#58a6ff" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 -10; 0 430; 0 -10" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>

<svg width="950" height="420" viewBox="0 0 950 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    
    .ascii {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #58a6ff; /* Base Blue Color */
    }

    .details {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      fill: #c9d1d9;
    }
    .title { fill: #58a6ff; font-weight: bold; font-size: 18px; }
    .label { fill: #8b949e; font-weight: bold; }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="10" />
  
  <!-- ASCII Art Face with SVG Native Animation -->
  <text x="20" y="30" class="ascii" xml:space="preserve">
    <!-- Glowing Animation -->
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="3s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#388bfd; #79c0ff; #388bfd" dur="3s" repeatCount="indefinite" />
    
    <tspan x="20" dy="1.2em">                                                      -:.  .:::. </tspan>
    <tspan x="20" dy="1.2em">                                               .::::..::....  :. . .</tspan>
    <tspan x="20" dy="1.2em">                                              . ..:... . .   . ..    .</tspan>
    <tspan x="20" dy="1.2em">                                          :.:..-.</tspan>
    <tspan x="20" dy="1.2em">                                        :-:...                         .</tspan>
    <tspan x="20" dy="1.2em">                                      ..::         :*%%%*=:           :.</tspan>
    <tspan x="20" dy="1.2em">                                     :..        #@@@@@@@@@@@@#.</tspan>
    <tspan x="20" dy="1.2em">                                    --:      .%@@%#+: .-+@@@@@@@.</tspan>
    <tspan x="20" dy="1.2em">                                   ::       +@@@*@@%*==+++%%@##@@</tspan>
    <tspan x="20" dy="1.2em">                                    :     .%@@@@%*- ..=+%@*==:  .*    :</tspan>
    <tspan x="20" dy="1.2em">                                  .:.    .@@@@@@@@@@@@@@@@@*:-===-.</tspan>
    <tspan x="20" dy="1.2em">                                   ::*%%=%@@@@@@@@@@@%+ .*=-%: :=+.</tspan>
    <tspan x="20" dy="1.2em">                                   :#@@@@@@@@@@@@%#**#%%+---*@@+-*</tspan>
    <tspan x="20" dy="1.2em">                                   +@@+#@@@@@@@@%-::@@@+=+*+@@@@@=</tspan>
    <tspan x="20" dy="1.2em">                                    @%++@@@@#%#**@@@@#+=*%*:-#@@@</tspan>
    <tspan x="20" dy="1.2em">                                     ..@@##*===--*%@@@@#*+##:+%#%</tspan>
    <tspan x="20" dy="1.2em">                                     .+@@+=-:... :.:.:=+*#%%+**#+</tspan>
    <tspan x="20" dy="1.2em">                                      *@@@%=.             :-.:-+</tspan>
    <tspan x="20" dy="1.2em">                                      @@@@@%#*=               :</tspan>
    <tspan x="20" dy="1.2em">                                      @@@@@%#*+=--:           :</tspan>
    <tspan x="20" dy="1.2em">                                     @@@@@@@@@%#*-:.....   .</tspan>
    <tspan x="20" dy="1.2em">                                    .@@@@@@@@@%#*=------=+*</tspan>
    <tspan x="20" dy="1.2em">                            -==-:..   *%@@@@@%#*+=====++*#.</tspan>
    <tspan x="20" dy="1.2em">                             :.      .:-:=*%%%##*********#:</tspan>
    <tspan x="20" dy="1.2em">                             :-=.    .:==+==*%%%%%##*=::  -#+</tspan>
    <tspan x="20" dy="1.2em">                     .-+*%%*+**+*+=+++--:=+++*%@@@*:.        =</tspan>
    <tspan x="20" dy="1.2em">             .+%%*#@%**%%%#+****#******+===++**%*::::----      =.</tspan>
    <tspan x="20" dy="1.2em">        =@#%#*#%=*#%**##%*****###***#*#**++**+*#+=+********++*--##*=*=</tspan>
    <tspan x="20" dy="1.2em">      %@%%**#******+*#**#++**#*###***####*++*++#**=*#****#**##**##%#*++#*#*:</tspan>
    <tspan x="20" dy="1.2em">    *@##*##+++%++#++#+*#**#######*++*####+*****##++***##*######**##%****###*+#@%#+</tspan>
  </text>

  <!-- Profile Details (Always Visible) -->
  <text x="570" y="100" class="details">
    <tspan x="570" dy="0" class="title">Avishka Induwara Kumarasinghe</tspan>
    <tspan x="570" dy="30"><tspan class="label">Brand:    </tspan> AVI</tspan>
    <tspan x="570" dy="25"><tspan class="label">Role:     </tspan> Full-Stack Developer</tspan>
    <tspan x="570" dy="25"><tspan class="label">Stack:    </tspan> Next.js, React, Tailwind</tspan>
    <tspan x="570" dy="25"><tspan class="label">Database: </tspan> Supabase, PostgreSQL</tspan>
    <tspan x="570" dy="25"><tspan class="label">Mobile:   </tspan> Flutter</tspan>
    <tspan x="570" dy="25"><tspan class="label">Current:  </tspan> Kurunduhami POS</tspan>
    <tspan x="570" dy="25"><tspan class="label">Location: </tspan> Sri Lanka</tspan>
  </text>

  <!-- Animated Scanner Line with SVG Native Animation -->
  <rect x="0" y="0" width="100%" height="3" fill="#58a6ff" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 -10; 0 430; 0 -10" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>
